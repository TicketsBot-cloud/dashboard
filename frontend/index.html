<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <!-- Discord Embed Left Border Color -->
    <meta name="theme-color" content="#2047f8" />

    <title>Tickets | Dashboard</title>
    <meta name="description" content="Official Web Dashboard of the Tickets Discord bot." />

    <!-- Open Graph / Discord Embed Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tickets Bot" />
    <meta property="og:title" content="Tickets | Dashboard" />
    <meta property="og:description" content="Official Web Dashboard of the Tickets Discord bot." />
    <meta property="og:url" content="https://dashboard.tickets.bot//" />

    <!-- Discord/Twitter Thumbnail Preview -->
    <meta property="og:image" content="https://dashboard.tickets.bot/web-app-manifest-512x512.png?v=20260827" />
    <meta name="twitter:card" content="summary" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png?v=20260827" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260827" />
    <link rel="shortcut icon" href="/favicon.ico?v=20260827" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260827" />
    <meta name="apple-mobile-web-app-title" content="Tickets Bot" />
    <link rel="manifest" href="/site.webmanifest?v=20260827" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Tickets | Dashboard",
      "description": "Official Web Dashboard of the Tickets Discord bot.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
  </head>
  <body>
    <noscript>
      <div style="padding: 1rem; font-family: sans-serif; text-align: center;">
        <strong>Tickets Bot requires JavaScript to run.</strong> Please enable it in your browser settings.
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
